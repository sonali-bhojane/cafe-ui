<body class="body">
<div class="contact-page container py-5">
  <div class="row g-4">

    <!-- LEFT : CONTACT FORM -->
    <div class="col-md-6">
      <div class="contact-form">
        <h3>Get in Touch</h3>

        <input type="text" placeholder="Your Name" class="form-control mb-3">
        <input type="tel" placeholder="Phone Number" class="form-control mb-3">
        <input type="email" placeholder="Email Address" class="form-control mb-3">
        <textarea rows="4" placeholder="Your Message" class="form-control mb-4"></textarea>

        <button class="btn send-btn w-100" (click)="send()">Send Message</button>
      </div>
    </div>

    <!-- RIGHT : INFO SECTIONS -->
    <div class="col-md-6">
      <div class="info-box">

        <div class="info-item">
          <h5>📍 Location</h5>
          <p>Pune, Maharashtra</p>
        </div>

        <div class="info-item">
          <h5>⏰ Opening Hours</h5>
          <p>Mon – Sun <br> 9:00 AM – 10:00 PM</p>
            <span class="btn text-danger fw-bold"> Open all public days</span>
        </div>

        <div class="info-item">
          <h5>💼 Work With Us</h5>
          <p>🤝Intrested joining our team or partnering with us? <br><b>careers@cafearoma.com</b></p>
        </div>

      </div>
    </div>

  </div>
</div>
</body>
